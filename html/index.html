<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/styles.css">
    <script src="../js/translateText.js?v=2" defer></script>
    <title>Hindi Translator</title>

</head>

<body>
    <div class="app">
<h1>Hindi Translator</h1>

<div class="subtitle">
    Hindi ↔ English
</div>

<!-- HINDI INPUT -->
<div class="card">

    <span class="label">
        🇮🇳 Hindi
    </span>

    <textarea
        id="hindiText"
        placeholder="Type Hindi or press Speak Hindi..."
        lang="hi"
        dir="auto"></textarea>

    <button id="speakButton"
        class="speech-button"
        type="button"
        onclick="toggleSpeech()">
    🎤 Speak Hindi
    </button>

    <button class="microphone-test-button"
        type="button"
        onclick="testMicrophone()">
    Test microphone
    </button>

    <button onclick="translateHindiToEnglish()">
        Translate to English
    </button>

</div>

<!-- ENGLISH INPUT -->
<div class="card">

    <span class="label">
        🇬🇧 English
    </span>

    <textarea
        id="englishInput"
        placeholder="Type English or press Speak English..."
        lang="en"
        dir="auto"></textarea>

    <button id="englishSpeakButton"
        class="speech-button"
        type="button"
        onclick="toggleEnglishSpeech()">
    🎤 Speak English
    </button>

    <button onclick="translateEnglishToHindi()">
        Translate to Hindi
    </button>

</div>

<!-- CAMERA -->
<div class="card">

    <span class="label">
        📷 Camera
    </span>

    <button class="secondary"
            onclick="openCamera()">
        Open Camera
    </button>

    <video id="camera"
           class="camera-preview"
           autoplay
           playsinline>
    </video>

    <button id="captureButton"
            type="button"
            style="display: none"
            onclick="captureImage()">
        📸 Capture and read text
    </button>

    <canvas id="canvas"
            style="display: none">
    </canvas>

    <div class="small">
        Camera translation will be added after
        speech translation is working.
    </div>

</div>

<div class="card">
    <span class="label">📷 Scan and translate text</span>

    <label for="ocrLanguage">Text language</label>
    <select id="ocrLanguage">
        <option value="hin">Hindi</option>
        <option value="eng">English</option>
    </select>

    <button class="secondary" type="button" onclick="openCamera()">
        Open Camera
    </button>

    <video id="camera"
           class="camera-preview"
           autoplay
           playsinline></video>

    <button id="captureButton"
            type="button"
            hidden
            onclick="captureImage()">
        📸 Capture and translate
    </button>

    <button id="closeCameraButton"
            class="secondary"
            type="button"
            hidden
            onclick="closeCamera()">
        Close Camera
    </button>

    <canvas id="canvas" hidden></canvas>
</div>

<div id="status"
     class="status"
     role="status"
     aria-live="polite">
    Ready
</div>
</div>
<script src="../js/clearText.js"></script>
<script src="../js/status.js"></script>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<script src="../js/camera.js"></script>
<script src="../js/speech.js"></script>
</body>
</html>
